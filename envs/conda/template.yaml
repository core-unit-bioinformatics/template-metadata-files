name: conda_env_template
dependencies:
  - Python=3.13.*
  - pip=26.*
  - conda>25.0.0
  - pyyaml=6.0.*
  - toml=0.10.*
  # Explicitly added in v2.1.0
  # tomlkit will gradually replace toml, e.g.,
  # in the cubi-tools package
  - tomlkit=0.15.*
  - semver=3.*
  - pylint=4.*
  - isort=8.*
  - black=26.*
  - ruff=0.15.*
